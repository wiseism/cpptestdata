name: CMake on a single platform

on:
  push:
    branches: [ "conan2" ]
  pull_request:
    branches: [ "conan2" ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: install conan2
      # CMakeLists 需要 conan 提供的 date 依赖(find_package(date CONFIG REQUIRED)),
      # 仅运行 cmake 无法找到依赖, 统一走 conan install → preset 构建流程
      run: |
        sudo apt update
        sudo apt install -y python3-pip
        pip3 install -U conan
        conan profile detect --force
        sed -i 's/Release/Debug/g' ~/.conan2/profiles/default
        sed -i 's/gnu14/gnu17/g' ~/.conan2/profiles/default
        cat ~/.conan2/profiles/default

    - name: conan install
      run: conan install . --build=missing -pr=default

    - name: Configure CMake (preset)
      run: cmake --preset conan-debug

    - name: Build
      run: cmake --build ${{github.workspace}}/build/Debug --config ${{env.BUILD_TYPE}} -j 2
